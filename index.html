  <head>

    <style>
      #app-loader{
        height: 100svh;
        transition: opacity 350ms ease-in-out;
        width: 100svw;
        position: absolute;
        top: 0;
        left: 0;
        display: grid;
        place-items: center;
        z-index: 99999999;
        background-color: #09090b;
        .loader {
      	height: 150px;
        width: 100px;
        border-radius: 55px 55px 10px 10px;
        position: relative;
        background: #FF3D00;
        background-image: linear-gradient(0deg,
            oklch(66.7% 0.295 322.15) 25%,
            oklch(74.6% 0.16 232.661) 25%,
            oklch(74.6% 0.16 232.661) 25%,
            oklch(74.6% 0.16 232.661) 50%,
            oklch(87.9% 0.169 91.605) 50%,
            oklch(87.9% 0.169 91.605) 50%,
            oklch(87.9% 0.169 91.605) 75%,
            oklch(76.8% 0.233 130.85)75%);
          background-position: 0px 0px;
          background-size: auto 175px;
          background-repeat: repeat-y;
          animation: colorShift 4s linear infinite;

        }
        .loader:before {
            content: '';
            position: absolute;
            left: 10px;
            bottom: 15px;
            width: 15px;
            height: 100px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.5);

          }
        .loader:after {
          content: "";
          position: absolute;
          left: 50%;
          top: 100%;
          transform: translate(-50% , 0);
          box-shadow: 0 15px 2px rgba(0, 0, 0, 0.25) inset;
          width: 32px;
          height: 45px;
          background: #E09C5F;
          border-radius: 0 0 12px 12px;
        }
      }
      @keyframes colorShift {
        to {    background-position: 0 175px}
      }

        
    </style>
